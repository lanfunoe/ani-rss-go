name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build info
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          version=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)
          version=${version#v}
          tags=
          for image in ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ani-rss-go docker.io/${DOCKERHUB_USERNAME,,}/ani-rss-go; do
            tags="$tags,$image:latest"
            if [ -n "$version" ]; then
              tags="$tags,$image:$version"
            fi
          done
          echo "version=${version:-dev}" >> $GITHUB_ENV
          echo "tags=${tags#,}" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./ani-rss-go/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.tags }}
          build-args: |
            VERSION=${{ env.version }}
            COMMIT=${{ github.sha }}
            BRANCH=${{ github.ref_type == 'tag' && github.event.repository.default_branch || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
